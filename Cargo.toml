[package]
name = "freespace"
version = "1.0.0"
edition = "2021"
description = "Fast Windows disk scanner and cleaner"
license = "MIT"

[dependencies]
# App logos: PNG-encoded and sent to the UI as data URLs.
base64 = "0.23"
png = "0.18"
rayon = "1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12", features = [] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
trash = "5"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56.0"

[dev-dependencies]
# Mock runtime for testing the commands without a window.
tauri = { version = "2.12", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
